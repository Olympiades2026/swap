# swap derrière le Apache de WAMP (proxy inverse).
#
# 1. Dans WAMP : icône de la barre des tâches > Apache > Modules Apache : cocher
#      headers_module, proxy_module, proxy_http_module   (WAMP redémarre Apache)
# 2. Ajouter à la fin de  <wamp>\bin\apache\apacheX.Y.Z\conf\extra\httpd-vhosts.conf  la ligne :
#      Include "C:/swap/wamp/swap-apache.conf"          (adapter le chemin du dossier swap)
# 3. Lancer swap : double-clic sur SERVEUR-WAMP.bat (écoute en local sur le port 8765, que seul Apache peut joindre)
# 4. Redémarrer Apache (WAMP > Redémarrer les services), puis ouvrir  http://NOM-DU-SERVEUR:8080
#
# Pour du HTTPS : remplacer  Listen 8080 / <VirtualHost *:8080>  par  443 et ajouter vos lignes
# SSLEngine on / SSLCertificateFile / SSLCertificateKeyFile ; changer "http" en "https" dans X-Forwarded-Proto.

Listen 8080

<VirtualHost *:8080>
    ServerName swap
    # La page de swap n'a pas besoin de PHP/MySQL : Apache ne fait que relayer vers le serveur Python.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:8765/ disablereuse=On
    ProxyPassReverse / http://127.0.0.1:8765/
</VirtualHost>
